<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SVG Icon Demo</title>
    <link rel="stylesheet" href="icons.css">
    <style>
      :root {
        --icon-size: 3rem;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 2rem;
        background-color: #f5f5f5;
        color: #1f2933;
      }
      h1 {
        margin-bottom: 1.5rem;
        font-size: clamp(1.5rem, 2.5vw, 2.25rem);
      }
      .icon-grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
      .icon-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        border-radius: 0.75rem;
        background-color: #ffffff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        gap: 0.75rem;
      }
      .icon-card span {
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SVG Icon Demo</h1>
      <div class="icon-grid">
        <div class="icon-card">
            <i class="svg-icon-mail"></i>
            <span>icon-mail</span>
        </div>
        <div class="icon-card">
            <i class="svg-pen-document-reload"></i>
            <span>pen-document-reload</span>
        </div>
        <div class="icon-card">
            <i class="svg-pen-document"></i>
            <span>pen-document</span>
        </div>
        <div class="icon-card">
            <i class="svg-save-sync"></i>
            <span>save-sync</span>
        </div>
        <div class="icon-card">
            <i class="svg-search-database"></i>
            <span>search-database</span>
        </div>
      </div>
    </main>
  </body>
</html>
